services:
  - type: web
    name: nohuseolje-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ACTIVE_POLICY_YEAR
        value: "2026"
      - key: CORS_ORIGINS
        value: '["*"]'
    healthCheckPath: /api/health
    autoDeploy: true
